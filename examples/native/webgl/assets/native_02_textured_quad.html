<!DOCTYPE html><html><head><style>
body{margin:0;padding:24px;background:#07111f;color:#dbeafe;font-family:"Segoe UI",sans-serif}.layout{display:flex;gap:20px}.panel{background:#101c31;border:1px solid #29456f;border-radius:12px;padding:16px}canvas{display:block;border-radius:8px;background:#020617}.status{margin-top:10px;color:#86efac;font:12px Consolas,monospace;white-space:pre-line}h2{margin:0 0 8px;color:#60a5fa}.note{max-width:300px;color:#94a3b8;font-size:13px;line-height:1.6}
</style></head><body><h2>WebGL Textured Quad</h2><div class="layout"><div class="panel"><canvas id="canvas" width="560" height="520"></canvas><div id="status" class="status">Creating texture...</div></div><div class="panel note">A generated RGBA checkerboard is uploaded with <b>texImage2DPixels</b>, sampled by <b>sampler2D</b>, and drawn on a rotating quad.</div></div><script type="text/lua">
local canvas=document:getElementById("canvas")
local status=document:getElementById("status")
local gl=canvas:getContext("webgl")
if not gl then status.textContent="ERROR: WebGL unavailable" return end
local function shader(kind,src)
  local s=gl:createShader(kind); gl:shaderSource(s,src); gl:compileShader(s)
  if gl:getShaderParameter(s,gl.COMPILE_STATUS)==0 then status.textContent="Shader error: "..gl:getShaderInfoLog(s); return nil end
  return s
end
local vs=shader(gl.VERTEX_SHADER,[[attribute vec2 aPos;attribute vec2 aUV;uniform float uAngle;varying vec2 vUV;void main(){float c=cos(uAngle),s=sin(uAngle);gl_Position=vec4(mat2(c,s,-s,c)*aPos,0.,1.);vUV=aUV;}]])
local fs=shader(gl.FRAGMENT_SHADER,[[precision mediump float;varying vec2 vUV;uniform sampler2D uTexture;void main(){gl_FragColor=texture2D(uTexture,vUV);}]])
if not vs or not fs then return end
local program=gl:createProgram();gl:attachShader(program,vs);gl:attachShader(program,fs);gl:linkProgram(program)
if gl:getProgramParameter(program,gl.LINK_STATUS)==0 then status.textContent="Link error: "..gl:getProgramInfoLog(program);return end
gl:useProgram(program)
local vertices={-.72,-.72,0,1, .72,-.72,1,1, -.72,.72,0,0, .72,.72,1,0}
local buffer=gl:createBuffer();gl:bindBuffer(gl.ARRAY_BUFFER,buffer);gl:bufferDataFloat(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW)
local pos=gl:getAttribLocation(program,"aPos");local uv=gl:getAttribLocation(program,"aUV")
gl:enableVertexAttribArray(pos);gl:vertexAttribPointer(pos,2,gl.FLOAT,false,16,0)
gl:enableVertexAttribArray(uv);gl:vertexAttribPointer(uv,2,gl.FLOAT,false,16,8)
local pixels={}
for y=0,7 do for x=0,7 do local on=(math.floor(x/2)+math.floor(y/2))%2==0;local r=on and 40 or 245;local g=on and 190 or 90;local b=on and 255 or 175;table.insert(pixels,r);table.insert(pixels,g);table.insert(pixels,b);table.insert(pixels,255) end end
local texture=gl:createTexture();gl:activeTexture(gl.TEXTURE0);gl:bindTexture(gl.TEXTURE_2D,texture)
gl:texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl:texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST)
gl:texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl:texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)
gl:texImage2DPixels(gl.TEXTURE_2D,0,gl.RGBA,8,8,0,gl.RGBA,gl.UNSIGNED_BYTE,pixels)
gl:uniform1i(gl:getUniformLocation(program,"uTexture"),0)
local angle=0;local frames=0
local function render()
  gl:beginFrame();gl:clearColor(.02,.04,.1,1);gl:clear(gl.COLOR_BUFFER_BIT);angle=angle+.008;gl:uniform1f(gl:getUniformLocation(program,"uAngle"),angle);gl:drawArrays(gl.TRIANGLE_STRIP,0,4);gl:endFrame();frames=frames+1
  if frames%30==0 then local p=gl:perfCounters();status.textContent=string.format("Texture: 8x8 RGBA checkerboard\nDraw calls: %d · Frames: %d",p.drawCalls,frames) end
  requestAnimationFrame(render)
end
requestAnimationFrame(render)
</script></body></html>
